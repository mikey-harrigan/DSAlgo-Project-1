<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VT vs NCSU Wrestling Analysis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            color: #e4e4e4;
            padding: 15px;
            font-size: 14px;
        }
        h1 { color: #e94560; font-size: 1.3rem; margin-bottom: 5px; }
        h2 { color: #50c9c3; font-size: 1rem; margin: 15px 0 10px; }
        .subtitle { color: #666; font-size: 0.75rem; margin-bottom: 15px; }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .stat {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-label { font-size: 0.7rem; color: #888; }
        .stat-value { font-size: 1.4rem; font-weight: bold; }
        .stat-value.vt { color: #ff6b6b; }
        .stat-value.ncsu { color: #ff4444; }
        .stat-value.tie { color: #fbbf24; }

        .slider-group {
            margin-bottom: 12px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 5px;
        }
        .slider-group input[type="range"] { width: 100%; }
        .slider-value { color: #e94560; font-weight: bold; }

        .bar-chart { margin: 10px 0; }
        .bar-row {
            display: flex;
            align-items: center;
            margin: 3px 0;
            font-size: 0.75rem;
        }
        .bar-label { width: 35px; text-align: right; margin-right: 8px; color: #888; }
        .bar-container { flex: 1; height: 18px; background: rgba(0,0,0,0.3); border-radius: 3px; overflow: hidden; }
        .bar {
            height: 100%;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 4px;
            font-size: 0.65rem;
            color: white;
            min-width: 30px;
        }
        .bar.vt { background: linear-gradient(90deg, #22c55e, #4ade80); }
        .bar.ncsu { background: linear-gradient(90deg, #dc2626, #f87171); }
        .bar.tie { background: linear-gradient(90deg, #d97706, #fbbf24); }

        .match-table { width: 100%; font-size: 0.7rem; border-collapse: collapse; }
        .match-table th, .match-table td {
            padding: 6px 4px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .match-table th { color: #888; font-weight: normal; }
        .match-table .wt { color: #e94560; font-weight: bold; }
        .match-table .vt-name { color: #4ade80; text-align: left; }
        .match-table .ncsu-name { color: #f87171; text-align: left; }
        .outcome-btn {
            display: inline-block;
            padding: 4px 6px;
            margin: 1px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.65rem;
            border: 1px solid transparent;
        }
        .outcome-btn.vt-win { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.3); }
        .outcome-btn.ncsu-win { background: rgba(220,38,38,0.2); border-color: rgba(220,38,38,0.3); }
        .outcome-btn.selected {
            background: #e94560 !important;
            border-color: white !important;
            color: white;
            font-weight: bold;
        }
        .outcome-btn:hover { opacity: 0.8; }

        .score-display {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            margin: 10px 0;
        }
        .score-display .vt-score { color: #4ade80; }
        .score-display .ncsu-score { color: #f87171; }

        .path-item {
            background: rgba(0,0,0,0.2);
            padding: 8px;
            margin: 4px 0;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.7rem;
        }
        .path-item .vt { color: #4ade80; }
        .path-item .ncsu { color: #f87171; }
        .path-item .prob { color: #fbbf24; float: right; }

        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background: #d63850; }
    </style>
</head>
<body>
    <h1>VT vs NCSU Wrestling</h1>
    <div class="subtitle">Brute Force Analysis: 1,073,741,824 paths</div>

    <div class="stats-grid">
        <div class="stat">
            <div class="stat-label">VT Win</div>
            <div class="stat-value vt" id="vtWin">55.21%</div>
        </div>
        <div class="stat">
            <div class="stat-label">NCSU Win</div>
            <div class="stat-value ncsu" id="ncsuWin">39.97%</div>
        </div>
        <div class="stat">
            <div class="stat-label">Tie</div>
            <div class="stat-value tie" id="tieProb">4.82%</div>
        </div>
        <div class="stat">
            <div class="stat-label">Expected Diff</div>
            <div class="stat-value" id="expDiff" style="color:#50c9c3">+2.7</div>
        </div>
    </div>

    <div class="card">
        <div class="slider-group">
            <label>Home Advantage (NCSU): <span class="slider-value" id="homeAdvVal">-3.9</span></label>
            <input type="range" id="homeAdv" min="-10" max="10" step="0.1" value="-3.9">
        </div>
        <div class="slider-group">
            <label>Unsportsmanlike -1pt: <span class="slider-value" id="unsportMinusVal">1%</span></label>
            <input type="range" id="unsportMinus" min="0" max="10" step="0.5" value="1">
        </div>
        <div class="slider-group">
            <label>Unsportsmanlike +1pt: <span class="slider-value" id="unsportPlusVal">5%</span></label>
            <input type="range" id="unsportPlus" min="0" max="10" step="0.5" value="5">
        </div>
        <button onclick="resetAll()">Reset All</button>
    </div>

    <div class="score-display" id="scoreDisplay" style="display:none;">
        <span class="vt-score" id="vtScore">0</span> - <span class="ncsu-score" id="ncsuScore">0</span>
    </div>

    <h2>Score Differential Distribution</h2>
    <div class="card">
        <div class="bar-chart" id="diffChart"></div>
    </div>

    <h2>Click Outcomes to Lock In</h2>
    <div class="card" style="overflow-x:auto;">
        <table class="match-table" id="matchTable"></table>
    </div>

    <h2>Top Likely Paths</h2>
    <div class="card" id="topPaths"></div>

<script>
const MATCHES = [
    {weight: 125, vt: "Ventresca", ncsu: "Robinson", probs: [1.5, 1, 5, 20, 55, 15, 1, 1.5]},
    {weight: 133, vt: "Seidel", ncsu: "Redding", probs: [2.25, 0.25, 0.5, 7, 5, 10, 60, 15]},
    {weight: 141, vt: "Crook", ncsu: "Jack", probs: [2.5, 7.5, 40, 30, 15, 3, 0.5, 1.5]},
    {weight: 149, vt: "Gaj", ncsu: "Buesgens", probs: [1, 1.5, 20, 38, 25, 10, 2.5, 2]},
    {weight: 157, vt: "Miller", ncsu: "Tucker", probs: [2, 0.25, 2.75, 15, 35, 20, 20, 5]},
    {weight: 165, vt: "Burton", ncsu: "Denny", probs: [0.5, 1, 12, 34.5, 37.5, 13, 0.5, 1]},
    {weight: 174, vt: "Desiante", ncsu: "Singleton", probs: [3, 35, 25, 27, 8, 1.25, 0.25, 0.5]},
    {weight: 184, vt: "Bullock", ncsu: "Gates", probs: [0.5, 1, 12, 33, 36, 15, 2, 0.5]},
    {weight: 197, vt: "Sasso", ncsu: "Brophy", probs: [1.5, 1, 7.5, 12.5, 40, 30, 5, 2.5]},
    {weight: 285, vt: "Mullen", ncsu: "Trumble", probs: [2, 3, 30, 47.25, 15, 2, 0.25, 0.5]},
];
const OUTCOMES = [-6, -5, -4, -3, 3, 4, 5, 6];
const OUTCOME_LABELS = ["-6", "-5", "-4", "-3", "+3", "+4", "+5", "+6"];
let realized = new Array(10).fill(null);

function computeDiffProbs() {
    let dp = {0: 1.0};
    for (let m = 0; m < 10; m++) {
        let newDp = {};
        const probs = MATCHES[m].probs;
        if (realized[m] !== null) {
            const outcome = OUTCOMES[realized[m]];
            for (const [d, p] of Object.entries(dp)) {
                const newD = parseInt(d) + outcome;
                newDp[newD] = (newDp[newD] || 0) + p;
            }
        } else {
            for (const [d, p] of Object.entries(dp)) {
                for (let o = 0; o < 8; o++) {
                    const newD = parseInt(d) + OUTCOMES[o];
                    newDp[newD] = (newDp[newD] || 0) + p * probs[o] / 100;
                }
            }
        }
        dp = newDp;
    }
    return dp;
}

function applyBiases(diffProbs) {
    const homeAdv = parseFloat(document.getElementById('homeAdv').value);
    const unsportMinus = parseFloat(document.getElementById('unsportMinus').value) / 100;
    const unsportPlus = parseFloat(document.getElementById('unsportPlus').value) / 100;

    let shifted = {};
    for (const [d, p] of Object.entries(diffProbs)) {
        const diff = parseFloat(d);
        const newDiff = diff + homeAdv;
        const floor = Math.floor(newDiff);
        const ceil = Math.ceil(newDiff);
        const frac = newDiff - floor;
        shifted[floor] = (shifted[floor] || 0) + p * (1 - frac);
        if (frac > 0) shifted[ceil] = (shifted[ceil] || 0) + p * frac;
    }

    const pNone = (1 - unsportMinus) * (1 - unsportPlus);
    const pMinus = unsportMinus * (1 - unsportPlus);
    const pPlus = (1 - unsportMinus) * unsportPlus;
    const pBoth = unsportMinus * unsportPlus;

    let final = {};
    for (const [d, p] of Object.entries(shifted)) {
        const diff = parseInt(d);
        final[diff] = (final[diff] || 0) + p * (pNone + pBoth);
        final[diff - 1] = (final[diff - 1] || 0) + p * pMinus;
        final[diff + 1] = (final[diff + 1] || 0) + p * pPlus;
    }
    return final;
}

function calcWinProbs(diffProbs) {
    let vt = 0, ncsu = 0, tie = 0, exp = 0;
    for (const [d, p] of Object.entries(diffProbs)) {
        const diff = parseInt(d);
        if (diff > 0) vt += p;
        else if (diff < 0) ncsu += p;
        else tie += p;
        exp += diff * p;
    }
    return {vt, ncsu, tie, exp};
}

function getCurrentScore() {
    let vt = 0, ncsu = 0;
    for (let m = 0; m < 10; m++) {
        if (realized[m] !== null) {
            const o = OUTCOMES[realized[m]];
            if (o > 0) vt += o; else ncsu -= o;
        }
    }
    return {vt, ncsu};
}

function updateAll() {
    document.getElementById('homeAdvVal').textContent = document.getElementById('homeAdv').value;
    document.getElementById('unsportMinusVal').textContent = document.getElementById('unsportMinus').value + '%';
    document.getElementById('unsportPlusVal').textContent = document.getElementById('unsportPlus').value + '%';

    const baseDiff = computeDiffProbs();
    const adjDiff = applyBiases(baseDiff);
    const win = calcWinProbs(adjDiff);

    document.getElementById('vtWin').textContent = (win.vt * 100).toFixed(2) + '%';
    document.getElementById('ncsuWin').textContent = (win.ncsu * 100).toFixed(2) + '%';
    document.getElementById('tieProb').textContent = (win.tie * 100).toFixed(2) + '%';
    document.getElementById('expDiff').textContent = (win.exp >= 0 ? '+' : '') + win.exp.toFixed(1);

    const hasRealized = realized.some(r => r !== null);
    const scoreDisplay = document.getElementById('scoreDisplay');
    if (hasRealized) {
        const score = getCurrentScore();
        document.getElementById('vtScore').textContent = score.vt;
        document.getElementById('ncsuScore').textContent = score.ncsu;
        scoreDisplay.style.display = 'block';
    } else {
        scoreDisplay.style.display = 'none';
    }

    updateDiffChart(adjDiff);
    updateMatchTable();
    updateTopPaths();
}

function updateDiffChart(diffProbs) {
    const diffs = Object.keys(diffProbs).map(Number).sort((a, b) => a - b);
    const maxProb = Math.max(...Object.values(diffProbs));

    const sigDiffs = diffs.filter(d => diffProbs[d] > 0.001);
    const minD = Math.min(...sigDiffs), maxD = Math.max(...sigDiffs);

    let html = '';
    for (let d = minD; d <= maxD; d += 2) {
        const p = diffProbs[d] || 0;
        const width = (p / maxProb * 100).toFixed(1);
        const cls = d > 0 ? 'vt' : d < 0 ? 'ncsu' : 'tie';
        html += '<div class="bar-row">' +
            '<div class="bar-label">' + (d > 0 ? '+' : '') + d + '</div>' +
            '<div class="bar-container">' +
            '<div class="bar ' + cls + '" style="width:' + width + '%">' + (p*100).toFixed(1) + '%</div>' +
            '</div></div>';
    }
    document.getElementById('diffChart').innerHTML = html;
}

function updateMatchTable() {
    let html = '<tr><th>Wt</th><th>VT</th><th>NCSU</th><th>Outcomes (click to lock)</th></tr>';

    for (let m = 0; m < 10; m++) {
        const match = MATCHES[m];
        let outcomeHtml = '';
        for (let o = 0; o < 8; o++) {
            const isSelected = realized[m] === o;
            const cls = o < 4 ? 'ncsu-win' : 'vt-win';
            outcomeHtml += '<span class="outcome-btn ' + cls + (isSelected ? ' selected' : '') + '" ' +
                'onclick="toggleOutcome(' + m + ',' + o + ')">' + OUTCOME_LABELS[o] + '</span>';
        }
        html += '<tr>' +
            '<td class="wt">' + match.weight + '</td>' +
            '<td class="vt-name">' + match.vt + '</td>' +
            '<td class="ncsu-name">' + match.ncsu + '</td>' +
            '<td>' + outcomeHtml + '</td></tr>';
    }
    document.getElementById('matchTable').innerHTML = html;
}

function updateTopPaths() {
    let paths = [];

    function generatePaths(matchIdx, currentOutcomes, currentProb) {
        if (matchIdx === 10) {
            let vtScore = 0, ncsuScore = 0;
            for (let i = 0; i < 10; i++) {
                const pts = OUTCOMES[currentOutcomes[i]];
                if (pts > 0) vtScore += pts; else ncsuScore -= pts;
            }
            paths.push({outcomes: currentOutcomes.slice(), prob: currentProb, vtScore: vtScore, ncsuScore: ncsuScore});
            return;
        }

        if (realized[matchIdx] !== null) {
            currentOutcomes.push(realized[matchIdx]);
            generatePaths(matchIdx + 1, currentOutcomes, currentProb);
            currentOutcomes.pop();
        } else {
            const probs = MATCHES[matchIdx].probs.map(function(p, i) { return {p: p, i: i}; }).sort(function(a, b) { return b.p - a.p; });
            for (let k = 0; k < Math.min(2, probs.length); k++) {
                currentOutcomes.push(probs[k].i);
                generatePaths(matchIdx + 1, currentOutcomes, currentProb * probs[k].p / 100);
                currentOutcomes.pop();
            }
        }
    }

    generatePaths(0, [], 1.0);
    paths.sort(function(a, b) { return b.prob - a.prob; });

    let html = '';
    for (let i = 0; i < Math.min(8, paths.length); i++) {
        const path = paths[i];
        let outcomeStr = '';
        for (let idx = 0; idx < path.outcomes.length; idx++) {
            const pts = OUTCOMES[path.outcomes[idx]];
            const cls = pts > 0 ? 'vt' : 'ncsu';
            const bold = realized[idx] !== null ? 'font-weight:bold;' : '';
            outcomeStr += '<span class="' + cls + '" style="' + bold + '">' + (pts > 0 ? '+' : '') + pts + '</span> ';
        }
        const winner = path.vtScore > path.ncsuScore ? 'VT' : (path.ncsuScore > path.vtScore ? 'NCSU' : 'TIE');
        html += '<div class="path-item">' + outcomeStr + '<span class="prob">' + path.vtScore + '-' + path.ncsuScore + ' (' + winner + ') ' + (path.prob*100).toFixed(3) + '%</span></div>';
    }
    document.getElementById('topPaths').innerHTML = html || '<div style="color:#666">No paths</div>';
}

function toggleOutcome(match, outcome) {
    realized[match] = realized[match] === outcome ? null : outcome;
    updateAll();
}

function resetAll() {
    realized = new Array(10).fill(null);
    document.getElementById('homeAdv').value = -3.9;
    document.getElementById('unsportMinus').value = 1;
    document.getElementById('unsportPlus').value = 5;
    updateAll();
}

document.getElementById('homeAdv').addEventListener('input', updateAll);
document.getElementById('unsportMinus').addEventListener('input', updateAll);
document.getElementById('unsportPlus').addEventListener('input', updateAll);

updateAll();
</script>
</body>
</html>
