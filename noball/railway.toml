[build]
builder = "nixpacks"
buildCommand = "npm install --include=dev && cd client && npm install --include=dev && npx vite build && cd ../server && node seed.js"

[deploy]
startCommand = "node server/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
